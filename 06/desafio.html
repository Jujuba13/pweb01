<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio - Página com div</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            padding: 40px 20px;
            background-color: #f4f4f9;
        }

        .moldura-principal {
            width: min(900px, 100%);
            margin: 0 auto;
            padding: 20px;
            background-color: #0b5a30;
            border-radius: 8px;
        }

        .header {
            margin-bottom: 20px;
            padding: 25px;
            background-color: #118244;
            border: 2px solid white;
            color: white;
            font-size: 26px;
            font-weight: bold;
            text-align: center;
        }

        .main-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .sidebar,
        .content {
            padding: 15px;
            background-color: white;
            border: 1px solid #b0c4de;
        }

        .sidebar {
            width: 28%;
        }

        .content {
            width: 72%;
        }

        .quadro-cinza {
            height: 100%;
            padding: 18px;
            background-color: #e0e0e0;
            border: 1px solid #a0a0a0;
        }

        .quadro-cinza ul {
            list-style-position: inside;
        }

        .quadro-cinza li,
        .quadro-cinza p {
            margin-bottom: 14px;
            color: #333;
            line-height: 1.5;
        }

        .voltar {
            display: inline-block;
            margin-top: 10px;
            color: #0b5a30;
            font-weight: bold;
        }

        .footer {
            padding: 16px;
            background-color: #1a252f;
            color: white;
            text-align: center;
        }

        @media (max-width: 650px) {
            .main-container {
                flex-direction: column;
            }

            .sidebar,
            .content {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="moldura-principal">
        <div class="header">Minha Página Web</div>

        <div class="main-container">
            <div class="sidebar">
                <div class="quadro-cinza">
                    <ul>
                        <li>Início</li>
                        <li>Conteúdo</li>
                        <li>Contato</li>
                    </ul>
                </div>
            </div>

            <div class="content">
                <div class="quadro-cinza">
                    <p>Este é o conteúdo principal da página.</p>
                    <p>
                        O layout foi construído com divs para separar o cabeçalho,
                        o menu lateral, o conteúdo principal e o rodapé.
                    </p>
                    <a class="voltar" href="index.html">Voltar para a Atividade 06</a>
                </div>
            </div>
        </div>

        <div class="footer">Rodapé da Página</div>
    </div>
</body>
</html>
